<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultá los precios</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="codigo.js"></script>

<body>
<div id="div2" class="catalogo"></div>
        <h2 class="nuevo1">Gracias por <br> ser parte de nuestra comunidad </h1>
        <h2 class="nuevo">Ahora mirá nuestro CATÁLOGO ;)</h1>

        <form>
            <p>Prenda:
            <select id="prenda">
          <option value="1">Remera</option>
          <option value="2">Jean</option>
          <option value="3">Campera</option>
          <option value="4">Vestido</option>
          <option value="5">Zapatillas</option>
                </select>
            </p>

            <p>Talle:
                <select id="talle">
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
                </select>
            </p>

            <p>Color:
                <select id="color">
            <option value="Negro">Negro</option>
            <option value="Blanco">Blanco</option>
            <option value="Rosa">Rosa</option>
            <option value="Azul">Azul</option>
                </select>
            </p>

            <p>Cantidad <input type="number" id="cantidad" value="1" min="1"></p>
        </form>

        <button onclick="cotizar()">VER PRECIO</button>
        <p id="resultado4"></p>
    </div>

    <div id="div2" class="promo">
        <h1 class="nuevo">PROMOCIONES</h1>

        <form>
        <p>Forma de pago:
          <select id="pago">
            <option value="1">Efectivo</option>
            <option value="2">Tarjeta de credito/debito</option>
            <option value="3">Transferencia</option>
                </select>
            </p>

            <p>Cupón de descuento <input type="text" id="cupon" placeholder="Ej: MODA10"></p>
        </form>

        <button onclick="aplicarDescuento()">APLICAR</button>
        <button onclick="volver()">SALIR</button>
        <p id="resultado5"></p>
    </div>

</body>
</html>
