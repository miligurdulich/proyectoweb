<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local de ropa</title>
   <link rel="stylesheet" href="estilos.css">
    <script src="codigo.js"></script>
</head>
<body>

<div class="contenedor">

    <header>
        <h1>RAPSODIA</h1>

        <p>
            En nuestro local ahora podes comprar online 
            tus prendas favoritas, APROVECHA!
            <br><br>
            (pero primero registrate para una mejor experiencia)
        </p>
    </header>

    <div id="div2">

        <h1>REGISTRATE</h1>

        <form>

            <p>
                Nombre
                <input type="text" id="nombre" placeholder="indique su nombre">
            </p>

            <p>
                Apellido
                <input type="text" id="apellido" placeholder="indique apellido">
            </p>

            <p>
                Edad
                <input type="number" id="edad" placeholder="indique su edad">
            </p>

            <p>
                Email
                <input type="email" id="email" placeholder="indique su email">
            </p>

        </form>

        <p id="resultado3"></p>
        
        <button onclick="window.location.href='catalogo.html'">
            REGISTRATE ACA
        </button>

    </div>

</div>
