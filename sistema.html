<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>SISTEMA</title>

<body>

  <!--haciendo el form de afiliacion-->


  <div id="div2" style="margin-left: 180px;">

    <h1>AFILIACION DEL CLIENTE</h1>
    <form>
      <p><strong>Nombre</strong> <input type="text" id="nombre" placeholder="indique su nombre" required></p>
      <p>Apellido <input type="text" id="apellido" placeholder="indique apellido"></p>
      <p><u>EDAD</u> <input type="number" id="edad"></p>
      <p>Fecha N<input type="date" name="fecha" value="2008-01-20"></p>
      <p>EMAIL <input type="email" id="email" placeholder="Indique su email"></p>
      <p>SEXO : Masculino <input type="radio" name="sexo" value="Masculino"> Femenino
        <input type="radio" name="sexo" value="Femenino">







    </form>

    <button onclick="afiliar()">AFILIAR</button>
    <br>
    <p id="resultado3"></p>



  </div>


  <div id="div2">




    <h1 class="nuevo">COTIZAR AUTO</h1>


    <form>


      <p>Marca del Auto:<select id="marca">
          <option value="1">FIAT</option>
          <option value="2">TOYOTA</option>
          <option value="3">JEEP</option>
          <option value="4">RENAULT</option>

        </select>

      </p>

      <p>Tipo de Auto:<select id="tipo">
          <option value="1">DEPORTIVO</option>
          <option value="2">CAMIONETA</option>
          <option value="3">SEDAN</option>
          <option value="4">COOPE</option>

        </select>





    </form>

    <button onclick="cotizar()">COTIZAR</button>
    <br>
    <p id="resultado4"></p>




  </div>







</body>
